spring:
  application:
    name: ryvenca-backend
  datasource:
    url: ${RYVENCA_DB_URL:jdbc:h2:file:./data/ryvenca;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${RYVENCA_DB_USER:sa}
    password: ${RYVENCA_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info

ryvenca:
  security:
    # HS256 signing secret, at least 32 bytes. MUST be overridden in production.
    jwt-secret: ${RYVENCA_JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    token-ttl: ${RYVENCA_TOKEN_TTL:30d}
  cors:
    allowed-origins: ${RYVENCA_CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:8081}
  storage:
    local-dir: ${RYVENCA_STORAGE_DIR:./data/media}
    # Absolute base used for media URLs (e.g. https://api.ryvenca.com). Empty = derived from the request.
    public-base-url: ${RYVENCA_PUBLIC_BASE_URL:}
    draft-retention: 24h
