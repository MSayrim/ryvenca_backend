# Color explanations ({0} = list of color names)
explain.color.singleColor=올 {0} 룩: 한 가지 컬러로 입으면 실루엣이 길어 보이고 룩에 통일감이 생겨요.
explain.color.monochrome={0} 조합의 선명한 대비가 그래픽하고 모던한 모노톤 룩을 완성해요.
explain.color.tonal={0} 모두 같은 컬러 계열의 다른 톤이에요. 톤온톤 레이어링이 세련된 깊이감을 더해요.
explain.color.allNeutral={0}의 뉴트럴 톤이 차분하고 균형 잡힌 팔레트를 이뤄요. 유행을 타지 않고 매치하기 쉬운 조합이에요.
explain.color.accentOnly={0} 컬러가 룩의 포인트예요. 나머지 아이템은 은은하게 균형을 잡아 줘요.
explain.color.singleAccent={0} 컬러가 뉴트럴한 베이스를 깔아 주고, {1} 컬러가 적당한 포인트를 더해요.
explain.color.softPair={0} 컬러의 부드러운 톤이 산뜻하고 가벼운 조화를 이뤄요.
explain.color.analogous={0} 컬러는 색상환에서 서로 이웃해 있어, 함께 입으면 부드럽고 조화로운 흐름이 생겨요.
explain.color.complementary={0} 컬러는 서로 보색 관계예요. 과감하면서도 균형 잡힌 대비를 만들어요.
explain.color.discordant={0} 조합은 함께 입기엔 조금 강한 편이에요. 뉴트럴 아이템을 더하면 균형을 잡을 수 있어요.
explain.color.busy={0} 컬러를 한 번에 입으면 다소 산만해 보여요. 아이템 하나를 뉴트럴 톤으로 바꾸면 조화가 더 좋아져요.
explain.color.palette=“{0}” 팔레트와 아주 가까운 컬러 조합이에요.
explain.color.accentEcho=같은 컬러를 두 아이템에 반복해 룩 전체가 하나로 이어져요.
explain.color.bagShoeEcho=가방과 신발의 컬러를 맞춰 룩을 완성했어요.
explain.color.nearClash=상의와 하의의 톤이 아주 비슷하지만 같지는 않아요. 좀 더 분명하게 대비를 주면 더 좋을 수 있어요.
explain.color.patternClash=패턴이 있는 두 아이템이 서로 시선을 끌려고 경쟁해요.

