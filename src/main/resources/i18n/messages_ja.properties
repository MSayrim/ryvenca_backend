# Color explanations ({0} = list of color names)
explain.color.singleColor=全身{0}のワントーンコーデ。1色でまとめるとシルエットが縦長に見え、統一感が生まれます。
explain.color.monochrome={0}のくっきりとしたコントラストが、グラフィカルでモダンなモノトーンコーデを演出します。
explain.color.tonal={0}は同系色の濃淡。トーンオントーンの重ね着で、洗練された奥行きが生まれます。
explain.color.allNeutral={0}のニュートラルカラーが、落ち着いたバランスのよい配色に。時代を問わず合わせやすい組み合わせです。
explain.color.accentOnly={0}がコーデの主役。ほかのアイテムがさりげなくバランスを取っています。
explain.color.singleAccent={0}がニュートラルなベースをつくり、{1}がほどよく差し色として効いています。
explain.color.softPair={0}のやわらかなトーンが、軽やかでフレッシュな調和を生み出します。
explain.color.analogous={0}は色相環で隣り合う色。合わせると、やわらかく調和のとれたグラデーションになります。
explain.color.complementary={0}は補色の関係。大胆ながらもバランスのよいコントラストが生まれます。
explain.color.discordant={0}の組み合わせは少し主張が強め。ニュートラルなアイテムを加えるとバランスが取れます。
explain.color.busy={0}を一度に合わせるとやや騒がしい印象に。1点をニュートラルカラーに替えると、まとまりがよくなります。
explain.color.palette=「{0}」パレットにとても近い配色です。
explain.color.accentEcho=同じ色を2つのアイテムでリンクさせて、コーデに統一感が生まれています。
explain.color.bagShoeEcho=バッグとシューズの色をそろえて、コーデをきれいに仕上げています。
explain.color.nearClash=トップスとボトムスが、似ているけれど同じではない微妙なトーンです。はっきりとコントラストをつけると、よりきまります。
explain.color.patternClash=柄物のアイテム2点が、互いに主張し合っています。

# Texture explanations ({0}, {1} = garment phrases such as "beige blazer")
explain.texture.suit={0}と{1}がスーツのように調和し、きちんと感のある力強いシルエットに。
explain.texture.smartMix={0}×{1}は、クラシックとカジュアルのバランスが絶妙なモダンな組み合わせです。
explain.texture.edgyContrast={0}×{1}は、ハードなレザーととろみ素材のコントラストがコーデに個性をプラスします。
explain.texture.classicBase={0}と{1}で、クラシックで頼れるベースが完成します。
explain.texture.knitContrast={0}×{1}は、やわらかなニットとすっきりとしたボトムスが好バランスです。
explain.texture.easyClassic=Tシャツ、ジーンズ、スニーカー。いつでも決まる、気負わない王道の3点セットです。
explain.texture.trench={0}が、時代に左右されないきちんと感のあるアウターとして活躍します。
explain.texture.variety=異なる素材感（{0}）が、コーデに奥行きを生み出します。
explain.texture.mixed={0}の異なる素材感（{1}）が、リッチで奥行きのある着こなしを演出します。
explain.texture.single=どのアイテムも{0}の質感でそろい、すっきりとまとまった印象です。
explain.texture.neutral=アイテムのシルエットと素材感が調和し、洗練された印象に仕上がっています。
explain.texture.mismatch={0}と{1}はフォーマル度にはっきりとした差があります。{2}を見直すと、コーデの完成度がさらに上がります。
explain.texture.highLow={0}×{1}は、きれいめとカジュアルをモダンにミックスした組み合わせです。

# Occasion explanations ({0}, {1} = occasion names)
explain.occasion.tooCasual={0}には少しカジュアルすぎるかもしれません。
explain.occasion.tooFormal={0}には少しフォーマルすぎるかもしれません。
explain.occasion.two={0}にも{1}にも、気軽に取り入れられます。
