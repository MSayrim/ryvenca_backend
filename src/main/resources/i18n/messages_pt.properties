# Color explanations ({0} = list of color names)
explain.color.singleColor={0} da cabeça aos pés: vestir uma só cor alonga a silhueta e deixa o look coeso.
explain.color.monochrome={0} criam um look monocromático gráfico e moderno, com contraste nítido.
explain.color.tonal={0} são tons da mesma família de cores; as camadas tom sobre tom trazem uma profundidade sofisticada.
explain.color.allNeutral={0}: os tons neutros formam uma paleta calma e equilibrada, uma combinação atemporal e fácil.
explain.color.accentOnly=O {0} é o ponto focal do look; as outras peças equilibram tudo com discrição.
explain.color.singleAccent=Base neutra em {0}, e o {1} traz um toque de cor na medida certa.
explain.color.softPair={0} criam uma harmonia fresca e leve com seus tons suaves.
explain.color.analogous={0} são vizinhos no círculo cromático; juntos, criam uma transição suave e harmoniosa.
explain.color.complementary={0} são cores complementares e criam um contraste ousado, mas equilibrado.
explain.color.discordant={0} juntos ficam um pouco chamativos; uma peça neutra pode equilibrar a dupla.
explain.color.busy={0} juntos deixam o look bem carregado; trocar uma peça por um tom neutro deixaria tudo mais harmonioso.
explain.color.palette=As cores estão bem próximas da nossa paleta “{0}”.
explain.color.accentEcho=Repetir a mesma cor em duas peças amarra o look.
explain.color.bagShoeEcho=Bolsa e calçado combinando dão o toque final ao look.
explain.color.nearClash=A parte de cima e a de baixo têm tons muito parecidos, mas não iguais; um contraste mais claro pode funcionar melhor.
explain.color.patternClash=Duas peças estampadas disputam a atenção.

