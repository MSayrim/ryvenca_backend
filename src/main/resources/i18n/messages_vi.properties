explain.color.tonal=Các tông {0} là những sắc độ cùng một họ màu; phối tone-sur-tone mang lại chiều sâu tinh tế.
explain.color.allNeutral={0}: các gam trung tính tạo nên bảng màu điềm tĩnh, cân bằng; một cách phối kinh điển và dễ mặc.
