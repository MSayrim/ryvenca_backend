explain.color.allNeutral={0}: neutral tones form a calm, balanced palette; a timeless, easy match.
explain.color.accentOnly={0} is the focal point of the outfit; the other pieces balance it quietly.
explain.color.singleAccent={0} set a neutral base, while {1} adds a controlled pop of color.
explain.color.softPair={0} create a fresh, light harmony with their soft tones.
explain.color.analogous={0} sit next to each other on the color wheel; together they give a soft, harmonious transition.
explain.color.complementary={0} are complementary colors; they create a bold yet balanced contrast.
explain.color.discordant={0} look a little loud together; a neutral piece could balance the pair.
explain.color.busy={0} together feel quite busy; swapping one piece for a neutral tone would improve the harmony.
