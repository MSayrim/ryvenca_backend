# Color explanations ({0} = list of color names)
explain.color.singleColor={0} de pies a cabeza: vestir de un solo color estiliza la silueta y da coherencia al look.
explain.color.monochrome=La combinación de {0} crea un look monocromático gráfico y moderno, con un contraste nítido.
explain.color.tonal={0}: tonos de una misma familia de color; las capas tono sobre tono aportan una profundidad sofisticada.
explain.color.allNeutral={0}: los tonos neutros forman una paleta serena y equilibrada; una combinación atemporal y fácil.
explain.color.accentOnly=El {0} es el punto focal del look; las demás prendas lo equilibran con discreción.
explain.color.singleAccent=Una base neutra de {0}, con el {1} como toque de color controlado.
explain.color.softPair={0}: una armonía fresca y ligera gracias a sus tonos suaves.
explain.color.analogous={0}: colores vecinos en el círculo cromático que, juntos, crean una transición suave y armoniosa.
explain.color.complementary={0}: colores complementarios que crean un contraste audaz pero equilibrado.
explain.color.discordant=La combinación de {0} resulta algo estridente; una prenda neutra podría equilibrarla.
explain.color.busy=La combinación de {0} resulta bastante recargada; cambiar una prenda por un tono neutro mejoraría la armonía.
explain.color.palette=Los colores se acercan mucho a nuestra paleta "{0}".
explain.color.accentEcho=Repetir el mismo color en dos prendas da unidad al look.
explain.color.bagShoeEcho=El bolso y los zapatos a juego completan el look.
explain.color.nearClash=La prenda superior y la inferior tienen tonos muy parecidos, pero no iguales; un contraste más marcado funcionaría mejor.
explain.color.patternClash=Dos prendas estampadas compiten por la atención.

