# Color explanations ({0} = list of color names)
explain.color.singleColor=从头到脚一身{0}：单一色调能拉长身形，让造型更有整体感。
explain.color.monochrome={0}对比利落鲜明，打造出富有图形感的现代黑白灰造型。
explain.color.tonal={0}同属一个色系，深浅层叠的同色系搭配增添高级的层次感。
explain.color.allNeutral={0}，中性色调构成沉静而平衡的配色，经典百搭，毫不费力。
explain.color.accentOnly={0}是整套造型的视觉焦点，其他单品低调地与之平衡。
explain.color.singleAccent={0}奠定中性基调，{1}则带来恰到好处的亮色点缀。
explain.color.softPair={0}以柔和的色调营造出清新轻盈的和谐感。
explain.color.analogous={0}在色环上彼此相邻，搭配在一起过渡柔和、自然和谐。
explain.color.complementary={0}互为互补色，形成大胆而平衡的对比。
explain.color.discordant={0}放在一起略显张扬，加入一件中性色单品就能平衡这组搭配。
explain.color.busy={0}组合在一起显得有些杂乱，把其中一件换成中性色会更协调。
explain.color.palette=这组颜色与我们的“{0}”配色非常接近。
explain.color.accentEcho=同一颜色在两件单品上呼应，让整套造型更有整体感。
explain.color.bagShoeEcho=包袋与鞋履相互呼应，为造型画龙点睛。
explain.color.nearClash=上装和下装色调非常接近却不完全相同，拉开对比度效果可能会更好。
explain.color.patternClash=两件带图案的单品在相互抢镜。

# Texture explanations ({0}, {1} = garment phrases such as "beige blazer")
explain.texture.suit={0}与{1}宛如一套西装，勾勒出利落挺拔的廓形。
explain.texture.smartMix={0}搭配{1}，兼顾经典与休闲的现代组合。
explain.texture.edgyContrast={0}搭配{1}，硬朗皮革与垂坠面料的碰撞让造型更有个性。
explain.texture.classicBase={0}与{1}构成经典又可靠的基础搭配。
explain.texture.knitContrast={0}搭配{1}，柔软的针织与利落剪裁的下装相得益彰。
explain.texture.easyClassic=T恤、牛仔裤加运动鞋，轻松随性、永不出错的经典三件套。
explain.texture.trench={0}增添了一层经典利落、永不过时的外搭。
explain.texture.variety=不同的面料质感（{0}）为造型增添层次。
explain.texture.mixed={0}各具质感（{1}），打造丰富而有层次的造型。
explain.texture.single=各单品都是相近的{0}质感，造型简洁统一。
explain.texture.neutral=各单品的剪裁与质感彼此协调，整体造型干净利落。
explain.texture.mismatch={0}与{1}的正式程度差距明显，重新挑选{2}或许能让整套造型更出彩。
explain.texture.highLow={0}搭配{1}，是正式与休闲的现代混搭。

