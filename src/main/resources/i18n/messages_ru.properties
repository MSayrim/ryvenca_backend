# Color explanations ({0} = list of color names)
explain.color.singleColor=Весь образ в одном цвете ({0}): такой приём визуально вытягивает силуэт и придаёт образу цельность.
explain.color.monochrome={0} создают графичный, современный монохромный образ с чётким контрастом.
explain.color.tonal={0} — оттенки одной цветовой гаммы; сочетание тон в тон добавляет образу утончённой глубины.
explain.color.allNeutral={0}: нейтральные тона складываются в спокойную, сбалансированную палитру — вневременное и беспроигрышное сочетание.
explain.color.accentOnly={0} — главный акцент образа, а остальные вещи спокойно его уравновешивают.
explain.color.singleAccent=Нейтральная база — {0}, а {1} добавляет дозированный акцент цвета.
explain.color.softPair={0}: мягкие оттенки создают свежую, лёгкую гармонию.
explain.color.analogous={0} соседствуют на цветовом круге и вместе дают мягкий, гармоничный переход.
explain.color.complementary={0} — дополнительные цвета: они создают смелый, но сбалансированный контраст.
explain.color.discordant={0} вместе смотрятся немного кричаще; нейтральная вещь поможет уравновесить это сочетание.
explain.color.busy={0}: вместе это выглядит довольно пёстро; замени одну вещь на нейтральную — и гармония станет лучше.
explain.color.palette=Цвета очень близки к нашей палитре «{0}».
explain.color.accentEcho=Один и тот же цвет в двух вещах связывает образ воедино.
explain.color.bagShoeEcho=Сумка и обувь в тон завершают образ.
explain.color.nearClash=Верх и низ очень близки по тону, но не совпадают; более явный контраст смотрелся бы лучше.
explain.color.patternClash=Две вещи с принтом спорят за внимание.

# Texture explanations ({0}, {1} = garment phrases such as "beige blazer")
explain.texture.suit={0} и {1} работают как костюм и создают чёткий, собранный силуэт.
explain.texture.smartMix={0} и {1}: современное сочетание, в котором классика уравновешивает повседневность.
explain.texture.edgyContrast={0} и {1}: грубая кожа на контрасте со струящейся тканью придаёт образу характер.
explain.texture.classicBase={0} и {1} — классическая, надёжная база.
explain.texture.knitContrast={0} и {1}: мягкий трикотаж и чётко скроенный низ уравновешивают друг друга.
explain.texture.easyClassic=Футболка, джинсы и кроссовки: непринуждённое классическое трио, которое работает всегда.
explain.texture.trench={0} добавляет образу вневременной, элегантный верхний слой.
explain.texture.variety=Разные фактуры ({0}) придают образу глубину.
explain.texture.mixed={0}: разные фактуры ({1}) создают богатый, многослойный образ.
explain.texture.single=Вещи близки по фактуре ({0}), поэтому образ выглядит чистым и цельным.
explain.texture.neutral=Крой и фактуры вещей хорошо сочетаются, и образ выглядит собранным.
explain.texture.mismatch={0} и {1} заметно различаются по степени формальности; другая вещь в категории «{2}» сделает образ сильнее.
explain.texture.highLow={0} и {1}: современный микс нарядного и расслабленного.

