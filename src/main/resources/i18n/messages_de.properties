# Color explanations ({0} = list of color names)
explain.color.singleColor=Ganz in {0}: Ein Look in nur einer Farbe streckt die Silhouette und wirkt wie aus einem Guss.
explain.color.monochrome={0} sorgen für einen grafischen, modernen Monochrom-Look mit klarem Kontrast.
explain.color.tonal={0} gehören zur selben Farbfamilie; Ton-in-Ton-Lagen verleihen dem Look raffinierte Tiefe.
explain.color.allNeutral={0}: Neutrale Töne ergeben eine ruhige, ausgewogene Palette – zeitlos und leicht zu kombinieren.
explain.color.accentOnly={0} ist der Blickfang des Outfits; die übrigen Teile halten sich dezent zurück.
explain.color.singleAccent=Eine neutrale Basis aus {0} – dazu setzt {1} einen gezielten Farbakzent.
explain.color.softPair={0} schaffen mit ihren sanften Tönen eine frische, leichte Harmonie.
explain.color.analogous={0} liegen im Farbkreis nebeneinander; zusammen ergeben sie einen sanften, harmonischen Übergang.
explain.color.complementary={0} sind Komplementärfarben; sie erzeugen einen mutigen, aber ausgewogenen Kontrast.
explain.color.discordant={0} wirken zusammen etwas laut; ein neutrales Teil könnte das Paar ausbalancieren.
explain.color.busy={0} wirken zusammen recht unruhig; tauschst du ein Teil gegen einen neutralen Ton, wird die Harmonie stimmiger.
explain.color.palette=Die Farben kommen unserer Palette „{0}“ sehr nahe.
explain.color.accentEcho=Dieselbe Farbe in zwei Teilen hält das Outfit zusammen.
explain.color.bagShoeEcho=Tasche und Schuhe in derselben Farbe runden den Look ab.
explain.color.nearClash=Ober- und Unterteil sind im Ton sehr ähnlich, aber nicht gleich; ein klarerer Kontrast könnte besser wirken.
explain.color.patternClash=Zwei gemusterte Teile konkurrieren um Aufmerksamkeit.

# Texture explanations ({0}, {1} = garment phrases such as "beige blazer")
explain.texture.suit={0} und {1} wirken wie ein Anzug und sorgen für eine starke, gepflegte Silhouette.
explain.texture.smartMix={0} und {1}: eine moderne Kombination, die Klassik und Lässigkeit ausbalanciert.
explain.texture.edgyContrast={0} und {1}: Robustes Leder trifft auf fließenden Stoff und verleiht dem Outfit Charakter.
explain.texture.classicBase={0} und {1} bilden eine klassische, verlässliche Basis.
explain.texture.knitContrast={0} und {1}: Weicher Strick und ein klar geschnittenes Unterteil gleichen sich aus.
explain.texture.easyClassic=T-Shirt, Jeans und Sneaker: ein lässiges Klassiker-Trio, das immer funktioniert.
explain.texture.trench={0}: zeitlos und elegant als oberste Lage.
explain.texture.variety=Die unterschiedlichen Materialien ({0}) verleihen dem Look Tiefe.
explain.texture.mixed={0}: Unterschiedliche Materialien ({1}) sorgen für einen reichen, vielschichtigen Look.
explain.texture.single=Die Teile haben eine ähnliche Materialanmutung ({0}) – für einen klaren, stimmigen Look.
explain.texture.neutral=Schnitte und Materialien der Teile harmonieren und ergeben einen gepflegten Look.
explain.texture.mismatch={0} und {1} liegen im Formalitätsgrad deutlich auseinander; eine andere Wahl in der Kategorie „{2}“ könnte das Outfit stärken.
explain.texture.highLow={0} und {1}: ein moderner Mix aus Eleganz und Lässigkeit.

