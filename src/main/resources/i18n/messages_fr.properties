# Color explanations ({0} = list of color names)
explain.color.singleColor=Total look {0} : s'habiller d'une seule couleur allonge la silhouette et rend la tenue cohérente.
explain.color.monochrome=L'association {0} crée un look monochrome graphique et moderne, au contraste net.
explain.color.tonal={0} : des nuances d'une même famille de couleurs ; le ton sur ton apporte une profondeur sophistiquée.
explain.color.allNeutral={0} : des tons neutres pour une palette calme et équilibrée ; un accord intemporel et facile.
explain.color.accentOnly={0} : la couleur phare de la tenue ; les autres pièces l'équilibrent en toute discrétion.
explain.color.singleAccent={0} pour la base neutre, {1} pour une touche de couleur maîtrisée.
explain.color.softPair={0} : une harmonie fraîche et légère, tout en tons doux.
explain.color.analogous={0} : des couleurs voisines sur le cercle chromatique, pour une transition douce et harmonieuse.
explain.color.complementary={0} : des couleurs complémentaires, pour un contraste audacieux mais équilibré.
explain.color.discordant={0} : une association un peu trop affirmée ; une pièce neutre pourrait équilibrer l'ensemble.
explain.color.busy={0} ensemble, c'est assez chargé ; remplacer une pièce par un ton neutre améliorerait l'harmonie.
explain.color.palette=Les couleurs sont très proches de notre palette « {0} ».
explain.color.accentEcho=La même couleur reprise sur deux pièces donne de l'unité à la tenue.
explain.color.bagShoeEcho=Le sac et les chaussures assortis complètent le look.
explain.color.nearClash=Le haut et le bas ont des tons très proches sans être identiques ; un contraste plus franc serait plus réussi.
explain.color.patternClash=Deux pièces à motifs se disputent l'attention.

# Texture explanations ({0}, {1} = garment phrases such as "beige blazer")
explain.texture.suit={0} et {1} : l'effet d'un costume, pour une silhouette forte et soignée.
explain.texture.smartMix={0} et {1} : un duo moderne qui équilibre classique et décontracté.
explain.texture.edgyContrast={0} et {1} : le cuir brut face à la fluidité du tissu donne du caractère à la tenue.
explain.texture.classicBase={0} et {1} : une base classique et sûre.
explain.texture.knitContrast={0} et {1} : la douceur de la maille et la netteté du bas s'équilibrent.
explain.texture.easyClassic=T-shirt, jean et baskets : un trio classique et sans effort qui marche à tous les coups.
explain.texture.trench={0} : une dernière couche intemporelle qui structure la tenue.
explain.texture.variety=Les différentes matières ({0}) donnent de la profondeur au look.
explain.texture.mixed={0} : des matières différentes ({1}) pour un look riche, tout en superpositions.
explain.texture.single=Toutes les pièces jouent sur une même matière ({0}) : un look net et cohérent.
explain.texture.neutral=Les coupes et les matières des pièces s'accordent pour un look soigné.
explain.texture.mismatch=Écart de formalité marqué entre {0} et {1} ; un autre choix côté {2} pourrait renforcer la tenue.
explain.texture.highLow={0} et {1} : un mélange moderne d'habillé et de décontracté.

