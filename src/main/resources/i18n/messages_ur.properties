# Color explanations ({0} = list of color names)
explain.color.singleColor=سر سے پاؤں تک {0}: ایک ہی رنگ پہننے سے سلہوٹ لمبا دکھائی دیتا ہے اور لُک یکجا محسوس ہوتا ہے۔
explain.color.monochrome={0} واضح کنٹراسٹ کے ساتھ ایک گرافک، جدید مونوکروم لُک بناتے ہیں۔
explain.color.tonal={0} ایک ہی رنگ خاندان کے شیڈز ہیں؛ ٹون آن ٹون لیئرنگ لُک میں نفیس گہرائی لاتی ہے۔
explain.color.allNeutral={0}: نیوٹرل ٹونز ایک پُرسکون، متوازن پیلیٹ بناتے ہیں؛ سدا بہار اور آسان میل۔
explain.color.accentOnly={0} اس آؤٹ فٹ کا مرکزِ نگاہ ہے؛ باقی پیسز خاموشی سے اس کا توازن قائم رکھتے ہیں۔
explain.color.singleAccent={0} سے ایک نیوٹرل بنیاد بنتی ہے، اور اس پر {1} کا تڑکا لُک میں نپی تلی رنگینی لاتا ہے۔
explain.color.softPair={0} اپنے نرم ٹونز سے ایک تازہ، ہلکی پھلکی ہم آہنگی پیدا کرتے ہیں۔
explain.color.analogous={0} رنگوں کے دائرے پر ایک دوسرے کے پڑوسی ہیں؛ مل کر یہ ایک نرم، ہم آہنگ تبدیلی پیدا کرتے ہیں۔
explain.color.complementary={0} ایک دوسرے کے تکمیلی رنگ ہیں؛ یہ بولڈ مگر متوازن کنٹراسٹ پیدا کرتے ہیں۔
explain.color.discordant={0} ساتھ میں کچھ زیادہ ہی شوخ لگتے ہیں؛ کوئی نیوٹرل پیس اس جوڑی کو متوازن کر سکتا ہے۔
explain.color.busy={0} ایک ساتھ خاصے بھرے بھرے لگتے ہیں؛ کسی ایک پیس کو نیوٹرل ٹون سے بدلنے پر ہم آہنگی بہتر ہو جائے گی۔
explain.color.palette=یہ رنگ ہمارے "{0}" پیلیٹ کے بہت قریب ہیں۔
explain.color.accentEcho=دو پیسز میں ایک ہی رنگ کو دہرانا پورے آؤٹ فٹ کو ایک لڑی میں پرو دیتا ہے۔
explain.color.bagShoeEcho=ہم رنگ بیگ اور جوتے لُک کو مکمل کر دیتے ہیں۔
explain.color.nearClash=ٹاپ اور باٹم کے ٹونز بہت قریب ہیں مگر ایک جیسے نہیں؛ ذرا واضح کنٹراسٹ زیادہ اچھا رہے گا۔
explain.color.patternClash=دو پرنٹڈ پیسز توجہ حاصل کرنے کے لیے آپس میں مقابلہ کر رہے ہیں۔

# Texture explanations ({0}, {1} = garment phrases such as "beige blazer")
explain.texture.suit={0} اور {1} کی جوڑی سوٹ جیسا تاثر دیتی ہے اور ایک مضبوط، نفیس سلہوٹ بناتی ہے۔
