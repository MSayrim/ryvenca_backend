explain.texture.mixed={0} کے مختلف ٹیکسچرز ({1}) ایک بھرپور، لیئرڈ لُک بناتے ہیں۔
explain.texture.single=تمام پیسز کا ملتا جلتا {0} ٹیکسچر ایک صاف، یکجا لُک دیتا ہے۔
explain.texture.neutral=پیسز کے کٹ اور ٹیکسچرز مل کر ایک نفیس لُک بناتے ہیں۔
explain.texture.mismatch={0} اور {1} کے درمیان فارمیلٹی کا واضح فرق ہے؛ {2} کا کوئی اور انتخاب آؤٹ فٹ کو مزید مضبوط بنا سکتا ہے۔
explain.texture.highLow={0} کے ساتھ {1}: ڈریسی اور ریلیکسڈ کا ایک جدید امتزاج۔

